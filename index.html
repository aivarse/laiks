<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laika Uzskaite</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; padding: 20px; max-width: 320px; margin: 0 auto; background-color: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; text-align: center; }
        label { font-size: 13px; color: #555; display: block; margin-top: 12px; font-weight: bold; }
        
        .time-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
        select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; background: #fff; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        
        button { width: 100%; margin-top: 18px; padding: 12px; background: #4CAF50; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        #status { margin-top: 12px; font-size: 13px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Laika uzskaite</h3>
        
        <label>Sākums (24h):</label>
        <div class="time-row">
            <select id="start-h"></select>
            <span>:</span>
            <select id="start-m"></select>
        </div>

        <label>Beigas (24h):</label>
        <div class="time-row">
            <select id="end-h"></select>
            <span>:</span>
            <select id="end-m"></select>
        </div>
        
        <label for="notes">Piezīmes:</label>
        <input type="text" id="notes" placeholder="Piem. Maiņa 1">
        
        <button onclick="sendData()">Saglabāt Google Sheet</button>
        <div id="status"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRmCbL44Mr79zJ_V2dV1r13IW7KQFAT85SY-BkNwtjHndu-8s4ESnI9HNRu2t9VEymww/exec";

        // Aizpilda stundu un minūšu izkrītošās izvēlnes
        function initTimeSelects() {
            const startH = document.getElementById('start-h');
            const endH = document.getElementById('end-h');
            const startM = document.getElementById('start-m');
            const endM = document.getElementById('end-m');

            // Noklusējuma vietturi / izvēles
            startH.innerHTML = '<option value="">Stundas</option>';
            endH.innerHTML = '<option value="">Stundas</option>';
            startM.innerHTML = '<option value="">Minūtes</option>';
            endM.innerHTML = '<option value="">Minūtes</option>';

            // Stundas (00 - 23)
            for (let i = 0; i < 24; i++) {
                const val = i.toString().padStart(2, '0');
                startH.add(new Option(val, val));
                endH.add(new Option(val, val));
            }

            // Minūtes (00 - 55 ar 5 minūšu soli vieglākai izvēlei)
            for (let i = 0; i < 60; i += 5) {
                const val = i.toString().padStart(2, '0');
                startM.add(new Option(val, val));
                endM.add(new Option(val, val));
            }
        }

        initTimeSelects();

        function sendData() {
            const sh = document.getElementById('start-h').value;
            const sm = document.getElementById('start-m').value;
            const eh = document.getElementById('end-h').value;
            const em = document.getElementById('end-m').value;
            const notes = document.getElementById('notes').value;
            const status = document.getElementById('status');

            if (!sh || !sm || !eh || !em) {
                status.style.color = '#d9534f';
                status.innerText = 'Lūdzu izvēlieties visus laika laukus!';
                return;
            }

            const start = `${sh}:${sm}`;
            const end = `${eh}:${em}`;

            const h1 = Number(sh);
            const m1 = Number(sm);
            const h2 = Number(eh);
            const m2 = Number(em);

            let duration = ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
            if (duration < 0) duration += 24;

            status.style.color = '#0275d8';
            status.innerText = 'Sūta datus...';

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    date: new Date().toISOString().split('T')[0],
                    startTime: start,
                    endTime: end,
                    durationHours: duration.toFixed(2),
                    notes: notes
                })
            }).then(() => {
                status.style.color = '#5cb85c';
                status.innerText = `Saglabāts! (${start} - ${end}, ${duration.toFixed(2)} h)`;
                
                // Atiestata izvēlnes
                document.getElementById('start-h').value = '';
                document.getElementById('start-m').value = '';
                document.getElementById('end-h').value = '';
                document.getElementById('end-m').value = '';
                document.getElementById('notes').value = '';
            }).catch(err => {
                status.style.color = '#d9534f';
                status.innerText = 'Kļūda nosūtot datus!';
            });
        }
    </script>
</body>
</html>
