<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laika Uzskaite</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; padding: 20px; max-width: 320px; margin: 0 auto; background-color: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; text-align: center; }
        label { font-size: 13px; color: #555; display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { width: 100%; margin-top: 18px; padding: 12px; background: #4CAF50; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        #status { margin-top: 12px; font-size: 13px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Laika uzskaite</h3>
        
        <label for="start">Sākums:</label>
        <input type="text" id="start" placeholder="08:00" onfocus="(this.type='time')" onblur="if(!this.value)this.type='text'" step="60" pattern="[0-9]{2}:[0-9]{2}" required>

        <label for="end">Beigas:</label>
        <input type="text" id="end" placeholder="17:00" onfocus="(this.type='time')" onblur="if(!this.value)this.type='text'" step="60" pattern="[0-9]{2}:[0-9]{2}" required>
        
        <label for="notes">Piezīmes:</label>
        <input type="text" id="notes" placeholder="Piem. Maiņa 1">
        
        <button onclick="sendData()">Saglabāt Google Sheet</button>
        <div id="status"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRmCbL44Mr79zJ_V2dV1r13IW7KQFAT85SY-BkNwtjHndu-8s4ESnI9HNRu2t9VEymww/exec";

        function sendData() {
            const startInput = document.getElementById('start').value;
            const endInput = document.getElementById('end').value;
            const notes = document.getElementById('notes').value;
            const status = document.getElementById('status');

            if (!startInput || !endInput) {
                status.style.color = '#d9534f';
                status.innerText = 'Lūdzu izvēlieties abus laikus!';
                return;
            }

            // Paņem droši tik un tā tikai pirmo HH:MM daļu (5 simbolus)
            const start = startInput.substring(0, 5);
            const end = endInput.substring(0, 5);

            // Aprēķina stundu starpību
            const [h1, m1] = start.split(':').map(Number);
            const [h2, m2] = end.split(':').map(Number);
            
            if (isNaN(h1) || isNaN(m1) || isNaN(h2) || isNaN(m2)) {
                status.style.color = '#d9534f';
                status.innerText = 'Nepareizs laika formāts!';
                return;
            }

            let duration = ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
            if (duration < 0) duration += 24;

            status.style.color = '#0275d8';
            status.innerText = 'Sūta datus...';

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    date: new Date().toISOString().split('T')[0],
                    startTime: start,
                    endTime: end,
                    durationHours: duration.toFixed(2),
                    notes: notes
                })
            }).then(() => {
                status.style.color = '#5cb85c';
                status.innerText = `Saglabāts! (${duration.toFixed(2)} h)`;
                
                // Attīra laukus un atgriež placeholder režīmā
                const sElem = document.getElementById('start');
                const eElem = document.getElementById('end');
                sElem.value = '';
                sElem.type = 'text';
                eElem.value = '';
                eElem.type = 'text';
                document.getElementById('notes').value = '';
            }).catch(err => {
                status.style.color = '#d9534f';
                status.innerText = 'Kļūda nosūtot datus!';
            });
        }
    </script>
</body>
</html>
