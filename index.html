<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laika Uzskaite</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; padding: 20px; max-width: 320px; margin: 0 auto; background-color: #f9f9f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; text-align: center; }
        label { font-size: 13px; color: #555; display: block; margin-top: 12px; font-weight: bold; }
        
        .timer-display { font-size: 32px; font-weight: bold; text-align: center; margin: 15px 0; color: #333; font-family: monospace; }
        .time-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
        select { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; background: #fff; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        
        .btn { width: 100%; margin-top: 10px; padding: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; color: white; }
        .btn-start { background: #2196F3; }
        .btn-stop { background: #ff9800; }
        .btn-save { background: #4CAF50; margin-top: 18px; }
        .btn-reset { background: #f44336; margin-top: 5px; font-size: 12px; padding: 6px; }
        
        #status { margin-top: 12px; font-size: 13px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Laika uzskaite</h3>

        <!-- Hronometrs -->
        <div class="timer-display" id="timer">00:00:00</div>
        <button id="main-btn" class="btn btn-start" onclick="toggleTimer()">SĀKT MAIŅU</button>
        <button id="reset-btn" class="btn btn-reset" onclick="resetTimer()" style="display:none;">Atcelt hronometru</button>

        <hr style="margin-top: 20px; border: 0; border-top: 1px solid #eee;">
        
        <label>Sākums (24h):</label>
        <div class="time-row">
            <select id="start-h"></select>
            <span>:</span>
            <select id="start-m"></select>
        </div>

        <label>Beigas (24h):</label>
        <div class="time-row">
            <select id="end-h"></select>
            <span>:</span>
            <select id="end-m"></select>
        </div>
        
        <label for="notes">Piezīmes:</label>
        <input type="text" id="notes" placeholder="Piem. Maiņa 1">
        
        <button class="btn btn-save" onclick="sendData()">Saglabāt Google Sheet</button>
        <div id="status"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyRmCbL44Mr79zJ_V2dV1r13IW7KQFAT85SY-BkNwtjHndu-8s4ESnI9HNRu2t9VEymww/exec";
        let timerInterval = null;

        function initTimeSelects() {
            const startH = document.getElementById('start-h');
            const endH = document.getElementById('end-h');
            const startM = document.getElementById('start-m');
            const endM = document.getElementById('end-m');

            startH.innerHTML = '<option value="">Stundas</option>';
            endH.innerHTML = '<option value="">Stundas</option>';
            startM.innerHTML = '<option value="">Minūtes</option>';
            endM.innerHTML = '<option value="">Minūtes</option>';

            for (let i = 0; i < 24; i++) {
                const val = i.toString().padStart(2, '0');
                startH.add(new Option(val, val));
                endH.add(new Option(val, val));
            }

            for (let i = 0; i < 60; i++) {
                const val = i.toString().padStart(2, '0');
                startM.add(new Option(val, val));
                endM.add(new Option(val, val));
            }
        }

        // Droša vērtības iestatīšana izkrītošajā sarakstā
        function setSelectValue(id, value) {
            const select = document.getElementById(id);
            const strVal = String(value).padStart(2, '0');
            select.value = strVal;
        }

        function toggleTimer() {
            const startTime = localStorage.getItem('shift_start_time');
            const now = new Date();

            if (!startTime) {
                // Sākt maiņu
                localStorage.setItem('shift_start_time', now.toISOString());
                
                setSelectValue('start-h', now.getHours());
                setSelectValue('start-m', now.getMinutes());
                
                updateUIState();
            } else {
                // Apturēt maiņu
                setSelectValue('end-h', now.getHours());
                setSelectValue('end-m', now.getMinutes());
                
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                
                const btn = document.getElementById('main-btn');
                btn.innerText = "SĀKT JAUNU MAIŅU";
                btn.className = "btn btn-start";
                localStorage.removeItem('shift_start_time');
            }
        }

        function updateTimerDisplay() {
            const startTimeStr = localStorage.getItem('shift_start_time');
            if (!startTimeStr) return;

            const start = new Date(startTimeStr);
            const now = new Date();
            const diffMs = now - start;

            const hrs = Math.floor(diffMs / 3600000).toString().padStart(2, '0');
            const mins = Math.floor((diffMs % 3600000) / 60000).toString().padStart(2, '0');
            const secs = Math.floor((diffMs % 60000) / 1000).toString().padStart(2, '0');

            document.getElementById('timer').innerText = `${hrs}:${mins}:${secs}`;
        }

        function updateUIState() {
            const startTimeStr = localStorage.getItem('shift_start_time');
            const btn = document.getElementById('main-btn');
            const resetBtn = document.getElementById('reset-btn');

            if (startTimeStr) {
                const start = new Date(startTimeStr);
                setSelectValue('start-h', start.getHours());
                setSelectValue('start-m', start.getMinutes());

                btn.innerText = "APTURĒT MAIŅU";
                btn.className = "btn btn-stop";
                resetBtn.style.display = "block";

                if (!timerInterval) {
                    timerInterval = setInterval(updateTimerDisplay, 1000);
                }
                updateTimerDisplay();
            } else {
                btn.innerText = "SĀKT MAIŅU";
                btn.className = "btn btn-start";
                resetBtn.style.display = "none";
                document.getElementById('timer').innerText = "00:00:00";
            }
        }

        function resetTimer() {
            localStorage.removeItem('shift_start_time');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            updateUIState();
        }

        initTimeSelects();
        updateUIState();

        function sendData() {
            const sh = document.getElementById('start-h').value;
            const sm = document.getElementById('start-m').value;
            const eh = document.getElementById('end-h').value;
            const em = document.getElementById('end-m').value;
            const notes = document.getElementById('notes').value;
            const status = document.getElementById('status');

            if (!sh || !sm || !eh || !em) {
                status.style.color = '#d9534f';
                status.innerText = 'Lūdzu izvēlieties visus laika laukus!';
                return;
            }

            const start = `${sh}:${sm}`;
            const end = `${eh}:${em}`;

            const h1 = Number(sh);
            const m1 = Number(sm);
            const h2 = Number(eh);
            const m2 = Number(em);

            let duration = ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
            if (duration < 0) duration += 24;

            status.style.color = '#0275d8';
            status.innerText = 'Sūta datus...';

            const payload = {
                date: new Date().toISOString().split('T')[0],
                startTime: start,
                endTime: end,
                durationHours: duration.toFixed(2),
                notes: notes
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(() => {
                status.style.color = '#5cb85c';
                status.innerText = `Saglabāts! (${start} - ${end}, ${duration.toFixed(2)} h)`;
                
                document.getElementById('start-h').value = '';
                document.getElementById('start-m').value = '';
                document.getElementById('end-h').value = '';
                document.getElementById('end-m').value = '';
                document.getElementById('notes').value = '';
                resetTimer();
            }).catch(err => {
                status.style.color = '#d9534f';
                status.innerText = 'Kļūda nosūtot datus!';
            });
        }
    </script>
</body>
</html>
