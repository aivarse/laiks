<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laika Uzskaite</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 300px; margin: 0 auto; }
        label { font-size: 12px; color: #666; display: block; margin-top: 10px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
        button { width: 100%; margin-top: 15px; padding: 10px; background: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        #status { margin-top: 10px; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
    <h3>Laika uzskaite</h3>
    <label>Sākums:</label>
    <input type="time" id="start">
    <label>Beigas:</label>
    <input type="time" id="end">
    <label>Piezīmes:</label>
    <input type="text" id="notes" placeholder="Piem. Maiņa 1">
    <button onclick="sendData()">Saglabāt Google Sheet</button>
    <div id="status"></div>

    <script>
        const WEB_APP_URL = "TE_IELĪMĒ_SAVU_APPS_SCRIPT_URL";

        function sendData() {
            const start = document.getElementById('start').value;
            const end = document.getElementById('end').value;
            const notes = document.getElementById('notes').value;
            const status = document.getElementById('status');

            if (!start || !end) {
                status.style.color = 'red';
                status.innerText = 'Ievadiet abus laikus!';
                return;
            }

            // Aprēķina stundas
            const [h1, m1] = start.split(':').map(Number);
            const [h2, m2] = end.split(':').map(Number);
            let duration = ((h2 * 60 + m2) - (h1 * 60 + m1)) / 60;
            if (duration < 0) duration += 24;

            status.style.color = 'blue';
            status.innerText = 'Sūta...';

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // Atļauj sūtīt no jebkuras vietas
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    date: new Date().toISOString().split('T')[0],
                    startTime: start,
                    endTime: end,
                    durationHours: duration.toFixed(2),
                    notes: notes
                })
            }).then(() => {
                status.style.color = 'green';
                status.innerText = `Saglabāts! (${duration.toFixed(2)} h)`;
                document.getElementById('start').value = '';
                document.getElementById('end').value = '';
                document.getElementById('notes').value = '';
            }).catch(err => {
                status.style.color = 'red';
                status.innerText = 'Kļūda nosūtot!';
            });
        }
    </script>
</body>
</html>
